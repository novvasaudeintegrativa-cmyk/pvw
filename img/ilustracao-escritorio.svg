<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-label="Ilustração de um escritório de obra: janela com prédios, mesa com planta, notebook e capacete">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d2740" stroke-width="1"/></pattern>
    <clipPath id="jan"><rect x="90" y="150" width="540" height="330"/></clipPath>
  </defs>
  <rect width="720" height="900" fill="#0e1116"/>
  <rect width="720" height="900" fill="url(#g)"/>

  <!-- luminária -->
  <path d="M360 0V70" stroke="#fff" stroke-width="3"/>
  <path d="M300 112a60 60 0 0 1 120 0z" fill="#2a45eb" stroke="#fff" stroke-width="3"/>
  <path d="M310 112L270 190H450L410 112z" fill="#8fa3ff" opacity=".12"/>

  <!-- janela com prédios -->
  <rect x="90" y="150" width="540" height="330" fill="#16213f"/>
  <g clip-path="url(#jan)">
    <circle cx="520" cy="230" r="34" fill="#8fa3ff" opacity=".7"/>
    <g fill="#2a45eb" stroke="#fff" stroke-width="2.5">
      <rect x="120" y="330" width="70" height="150"/>
      <rect x="205" y="270" width="80" height="210"/>
      <rect x="300" y="350" width="60" height="130"/>
      <rect x="375" y="240" width="90" height="240"/>
      <rect x="480" y="320" width="70" height="160"/>
      <rect x="560" y="290" width="60" height="190"/>
    </g>
    <g fill="#fff" opacity=".85">
      <rect x="215" y="290" width="12" height="12"/><rect x="245" y="290" width="12" height="12"/><rect x="215" y="325" width="12" height="12"/><rect x="245" y="325" width="12" height="12"/>
      <rect x="390" y="260" width="12" height="12"/><rect x="420" y="260" width="12" height="12"/><rect x="390" y="295" width="12" height="12"/><rect x="420" y="295" width="12" height="12"/><rect x="390" y="330" width="12" height="12"/><rect x="420" y="330" width="12" height="12"/>
    </g>
    <!-- guindaste -->
    <path d="M150 330V190H330M150 190L120 215M330 190V240" stroke="#8fa3ff" stroke-width="3" fill="none"/>
  </g>
  <rect x="90" y="150" width="540" height="330" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M360 150V480M90 315H630" stroke="#fff" stroke-width="4"/>

  <!-- mesa -->
  <rect x="40" y="640" width="640" height="26" fill="#e6eaff"/>
  <rect x="80" y="666" width="26" height="200" fill="#e6eaff"/>
  <rect x="614" y="666" width="26" height="200" fill="#e6eaff"/>
  <rect x="106" y="680" width="508" height="14" fill="#2a45eb" opacity=".6"/>

  <!-- planta sobre a mesa -->
  <polygon points="190,632 520,632 566,552 236,552" fill="#2a45eb" stroke="#fff" stroke-width="3"/>
  <g stroke="#fff" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <path d="M300 618V586H370V618M286 586L335 562L384 586"/>
    <path d="M410 612H480M425 592H495M455 622L488 566"/>
  </g>

  <!-- rolo de planta -->
  <g transform="translate(150 640) rotate(-8)">
    <rect x="-90" y="-30" width="170" height="30" rx="15" fill="#fff" stroke="#8fa3ff" stroke-width="3"/>
    <ellipse cx="-90" cy="-15" rx="8" ry="15" fill="#8fa3ff"/>
  </g>

  <!-- notebook -->
  <rect x="68" y="516" width="150" height="100" rx="6" fill="#0e1116" stroke="#fff" stroke-width="3"/>
  <path d="M96 590L120 560L146 580L176 540L200 570" stroke="#8fa3ff" stroke-width="3" fill="none"/>
  <path d="M52 640L68 616H218L234 640z" fill="#e6eaff" stroke="#fff" stroke-width="2"/>

  <!-- capacete -->
  <g transform="translate(600 640)">
    <path d="M-56 0a56 56 0 0 1 112 0z" fill="#fff"/>
    <rect x="-68" y="-8" width="136" height="12" rx="6" fill="#fff"/>
    <rect x="-12" y="-66" width="24" height="26" rx="6" fill="#2a45eb" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- placa da empresa -->
  <g transform="translate(180 750)">
    <rect width="360" height="64" fill="none" stroke="#fff" stroke-width="2.5"/>
    <text x="180" y="28" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="20" letter-spacing="6" fill="#fff">PVW</text>
    <text x="180" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="3" fill="#8fa3ff">CONSTRUÇÃO E REFORMAS</text>
  </g>
</svg>
